# Place this file at .github/workflows/deploy.yml in the repo.
#
# Deploys to the EC2 instance via AWS Systems Manager (SSM) send-command -
# no SSH keys, no open port 22 required. Runs after the existing "CI
# Pipeline" workflow (ci.yml) succeeds on main, or manually via
# workflow_dispatch.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   AWS_ROLE_ARN      - IAM role ARN GitHub OIDC assumes (see note below)
#   AWS_REGION        - e.g. ap-south-1
#   EC2_INSTANCE_ID   - from `terraform output instance_id`
#   DOCKERHUB_USERNAME (already exists from ci.yml)
#
# One-time setup: create an IAM OIDC identity provider for
# token.actions.githubusercontent.com and a role trusting it, scoped to
# ssm:SendCommand / ssm:GetCommandInvocation on this one instance. This
# avoids storing long-lived AWS access keys as GitHub secrets.

name: Deploy to EC2

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main, feature-swagger]
    types: [completed]
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Pull latest code, images and restart the stack
        run: |
          echo "Waiting for instance SSM agent to be online..."
          for i in {1..12}; do
            STATUS=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" --query "InstanceInformationList[0].PingStatus" --output text 2>/dev/null || echo "Offline")
            if [ "$STATUS" == "Online" ]; then
              echo "SSM agent is Online!"
              break
            fi
            echo "Waiting for SSM agent to register with AWS SSM (attempt $i/12)..."
            sleep 10
          done

          TARGET_BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name || 'feature-swagger' }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }}" \
            --parameters "{\"commands\":[
              \"if [ ! -d /home/ec2-user/app/.git ]; then git clone https://github.com/shravaneeghatol/ecom-saga-project.git /home/ec2-user/app; fi\",
              \"cd /home/ec2-user/app\",
              \"git fetch origin && git checkout $TARGET_BRANCH && git pull origin $TARGET_BRANCH\",
              \"if [ ! -f .env ]; then cp .env.example .env; fi\",
              \"chmod +x scripts/*.sh\",
              \"./scripts/configure-monitoring-ips.sh app\",
              \"docker compose -f docker-compose.yml -f Infrastructure/docker-compose.prod.yml pull\",
              \"docker compose -f docker-compose.yml -f Infrastructure/docker-compose.prod.yml up -d --force-recreate\",
              \"echo Waiting for services to boot...\",
              \"sleep 15\",
              \"for p in 8081 8082 8083 8084; do\",
              \"  echo Checking port \$p;\",
              \"  for i in {1..24}; do\",
              \"    curl -sf http://localhost:\$p/actuator/health && break || echo Waiting...;\",
              \"    sleep 10;\",
              \"  done;\",
              \"  curl -sf http://localhost:\$p/actuator/health || exit 1;\",
              \"done\"
            ]}" \
            --query "Command.CommandId" --output text)

          # Custom waiter that allows up to 10 minutes instead of the default 100 seconds
          echo "Waiting for deployment to complete (up to 10 minutes)..."
          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query "Status" --output text)
            if [ "$STATUS" == "Success" ]; then
              echo "Command succeeded!"
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              echo "Command failed with status: $STATUS"
              exit 1
            fi
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          # Deploy Observability Stack to Monitoring Instance #2
          MONITORING_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ecom-saga-monitoring" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text 2>/dev/null || echo "")

          if [ -n "$MONITORING_INSTANCE_ID" ] && [ "$MONITORING_INSTANCE_ID" != "None" ]; then
            echo "Waiting for Monitoring Instance $MONITORING_INSTANCE_ID SSM agent to register Online..."
            for i in {1..30}; do
              PING_STATUS=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$MONITORING_INSTANCE_ID" \
                --query "InstanceInformationList[0].PingStatus" \
                --output text 2>/dev/null || echo "Offline")

              if [ "$PING_STATUS" == "Online" ]; then
                echo "Monitoring Instance SSM agent is Online!"
                break
              fi
              echo "Monitoring SSM agent status: $PING_STATUS. Retrying in 10s... ($i/30)"
              sleep 10
            done

            echo "Deploying Observability Stack to Monitoring Instance: $MONITORING_INSTANCE_ID"
            aws ssm send-command \
              --instance-ids "$MONITORING_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy Monitoring Stack ${{ github.sha }}" \
              --parameters "{\"commands\":[
                \"if [ ! -d /home/ec2-user/app/.git ]; then git clone https://github.com/shravaneeghatol/ecom-saga-project.git /home/ec2-user/app; fi\",
                \"cd /home/ec2-user/app\",
                \"git fetch origin && git checkout $TARGET_BRANCH && git pull origin $TARGET_BRANCH\",
                \"chmod +x scripts/*.sh\",
                \"./scripts/configure-monitoring-ips.sh monitoring\",
                \"docker compose -f docker-compose.monitoring.yml up -d --force-recreate\"
              ]}"
          fi
