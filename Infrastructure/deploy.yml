# Place this file at .github/workflows/deploy.yml in the repo.
#
# Deploys to the EC2 instance via AWS Systems Manager (SSM) send-command -
# no SSH keys, no open port 22 required. Runs after the existing "CI
# Pipeline" workflow (ci.yml) succeeds on main, or manually via
# workflow_dispatch.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   AWS_ROLE_ARN      - IAM role ARN GitHub OIDC assumes (see note below)
#   AWS_REGION        - e.g. ap-south-1
#   EC2_INSTANCE_ID   - from `terraform output instance_id`
#   DOCKERHUB_USERNAME (already exists from ci.yml)
#
# One-time setup: create an IAM OIDC identity provider for
# token.actions.githubusercontent.com and a role trusting it, scoped to
# ssm:SendCommand / ssm:GetCommandInvocation on this one instance. This
# avoids storing long-lived AWS access keys as GitHub secrets.

name: Deploy to EC2

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main, feature-swagger]
    types: [completed]
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Pull latest code, images and restart the stack
        run: |
          echo "Waiting for instance SSM agent to be online..."
          # ── Wait for SSM agent ────────────────────────────────────────────────
          for i in $(seq 1 12); do
            PING=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "Offline")
            [ "$PING" == "Online" ] && echo "SSM agent Online!" && break
            echo "SSM agent status: $PING. Waiting 3s... ($i/12)"
            sleep 3
          done

          # ── Determine target branch ───────────────────────────────────────────
          TARGET_BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [ -z "$TARGET_BRANCH" ] || [ "$TARGET_BRANCH" == "" ]; then
            TARGET_BRANCH="feature-swagger"
          fi
          echo "Target branch: $TARGET_BRANCH"

          # ── Send deployment command to Instance #1 ────────────────────────────
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy App ${{ github.sha }}" \
            --parameters "{\"commands\":[
              \"set -e\",
              \"if [ ! -d /home/ec2-user/app/.git ]; then git clone https://github.com/shravaneeghatol/ecom-saga-project.git /home/ec2-user/app; fi\",
              \"cd /home/ec2-user/app\",
              \"git fetch origin\",
              \"git checkout ${TARGET_BRANCH} || git checkout main\",
              \"git pull origin ${TARGET_BRANCH} || git pull origin main\",
              \"if [ ! -f .env ]; then cp .env.example .env; fi\",
              \"chmod +x scripts/*.sh\",
              \"./scripts/configure-monitoring-ips.sh app\",
              \"docker compose -f docker-compose.yml -f Infrastructure/docker-compose.prod.yml pull\",
              \"docker compose -f docker-compose.yml -f Infrastructure/docker-compose.prod.yml up -d --force-recreate\",
              \"echo Waiting for services to start...\",
              \"for i in {1..30}; do if curl -sf http://localhost:8081/actuator/health && curl -sf http://localhost:8082/actuator/health && curl -sf http://localhost:8083/actuator/health && curl -sf http://localhost:8084/actuator/health; then echo All microservices healthy!; break; fi; sleep 3; done\",
              \"echo App Stack deployment complete\"
            ]}" \
            --query "Command.CommandId" --output text)

          echo "Waiting for App Stack deployment to complete..."
          for i in $(seq 1 100); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "  Status: $STATUS ($i/100)"
            [ "$STATUS" == "Success" ] && echo "✅ App Stack deployed!" && break
            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              echo "❌ Deployment failed: $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
              exit 1
            fi
            sleep 3
          done

      - name: Deploy Monitoring Stack to Instance #2
        run: |
          # ── Resolve Instance #2 by Name tag ──────────────────────────────────
          MONITORING_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ecom-saga-monitoring" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text 2>/dev/null || echo "")

          if [ -z "$MONITORING_INSTANCE_ID" ] || [ "$MONITORING_INSTANCE_ID" == "None" ]; then
            echo "⚠️  No monitoring instance found, skipping monitoring stack deployment."
            exit 0
          fi
          echo "Deploying Monitoring Stack to instance: $MONITORING_INSTANCE_ID"

          # ── Wait for SSM agent ────────────────────────────────────────────────
          for i in $(seq 1 12); do
            PING=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$MONITORING_INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "Offline")
            [ "$PING" == "Online" ] && echo "Monitoring SSM agent Online!" && break
            echo "Monitoring SSM status: $PING. Waiting 3s... ($i/12)"
            sleep 3
          done

          # ── Determine target branch ───────────────────────────────────────────
          TARGET_BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [ -z "$TARGET_BRANCH" ] || [ "$TARGET_BRANCH" == "" ]; then
            TARGET_BRANCH="feature-swagger"
          fi
          echo "Target branch: $TARGET_BRANCH"

          # ── Send deployment command to Instance #2 ────────────────────────────
          MONITORING_CMD_ID=$(aws ssm send-command \
            --instance-ids "$MONITORING_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Monitoring ${{ github.sha }}" \
            --parameters "{\"commands\":[
              \"set -e\",
              \"if [ ! -d /home/ec2-user/app/.git ]; then git clone https://github.com/shravaneeghatol/ecom-saga-project.git /home/ec2-user/app; fi\",
              \"cd /home/ec2-user/app\",
              \"git fetch origin\",
              \"git checkout ${TARGET_BRANCH} || git checkout main\",
              \"git pull origin ${TARGET_BRANCH} || git pull origin main\",
              \"chmod +x scripts/*.sh\",
              \"./scripts/configure-monitoring-ips.sh monitoring\",
              \"docker compose -f docker-compose.monitoring.yml up -d --force-recreate\",
              \"echo Monitoring Stack deployment complete\"
            ]}" \
            --query "Command.CommandId" --output text)

          echo "Waiting for Monitoring Stack deployment to complete..."
          for i in $(seq 1 100); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$MONITORING_CMD_ID" \
              --instance-id "$MONITORING_INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "  Status: $STATUS ($i/100)"
            [ "$STATUS" == "Success" ] && echo "✅ Monitoring Stack deployed!" && break
            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              echo "❌ Monitoring deployment failed: $STATUS"
              aws ssm get-command-invocation --command-id "$MONITORING_CMD_ID" --instance-id "$MONITORING_INSTANCE_ID"
              exit 1
            fi
            sleep 3
          done
