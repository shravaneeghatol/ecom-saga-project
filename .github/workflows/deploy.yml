name: Deploy to EC2

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main, feature-swagger]
    types: [completed]
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Pull latest code, images and restart the stack
        run: |
          # Dynamically find the EC2 instance by its Name tag - no hardcoded instance ID needed
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ecom-saga-app" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text 2>/dev/null || echo "")

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "❌ Error: No running EC2 instance found with tag Name=ecom-saga-app!"
            echo "Please run 'cd Infrastructure && terraform apply -auto-approve' to launch the EC2 instances first."
            exit 1
          fi

          echo "Deploying to instance: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }}" \
            --parameters '{"commands":[
              "if [ ! -d /home/ec2-user/app/.git ]; then git clone https://github.com/shravaneeghatol/ecom-saga-project.git /home/ec2-user/app; fi",
              "cd /home/ec2-user/app",
              "git fetch origin && git checkout $TARGET_BRANCH && git pull origin $TARGET_BRANCH",
              "if [ ! -f .env ]; then cp .env.example .env; fi",
              "chmod +x scripts/*.sh",
              "./scripts/configure-monitoring-ips.sh app",
              "docker compose -f docker-compose.yml -f Infrastructure/docker-compose.prod.yml pull",
              "docker compose -f docker-compose.yml -f Infrastructure/docker-compose.prod.yml up -d --force-recreate",
              "echo Waiting for services to boot...",
              "sleep 15",
              "for p in 8081 8082 8083 8084; do",
              "  echo Checking port $p;",
              "  for i in {1..24}; do",
              "    curl -sf http://localhost:$p/actuator/health && break || echo Waiting...;",
              "    sleep 10;",
              "  done;",
              "  curl -sf http://localhost:$p/actuator/health || exit 1;",
              "done"
            ]}' \
            --query "Command.CommandId" --output text)

          # Custom waiter that allows up to 10 minutes instead of the default 100 seconds
          echo "Waiting for deployment to complete (up to 10 minutes)..."
          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
            if [ "$STATUS" == "Success" ]; then
              echo "Command succeeded!"
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              echo "Command failed with status: $STATUS"
              exit 1
            fi
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          # Deploy Observability Stack to Monitoring Instance #2
          MONITORING_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ecom-saga-monitoring" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text 2>/dev/null || echo "")

          if [ -n "$MONITORING_INSTANCE_ID" ] && [ "$MONITORING_INSTANCE_ID" != "None" ]; then
            echo "Waiting for Monitoring Instance $MONITORING_INSTANCE_ID SSM agent to register Online..."
            for i in {1..30}; do
              PING_STATUS=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$MONITORING_INSTANCE_ID" \
                --query "InstanceInformationList[0].PingStatus" \
                --output text 2>/dev/null || echo "Offline")

              if [ "$PING_STATUS" == "Online" ]; then
                echo "Monitoring Instance SSM agent is Online!"
                break
              fi
              echo "Monitoring SSM agent status: $PING_STATUS. Retrying in 10s... ($i/30)"
              sleep 10
            done

            echo "Deploying Observability Stack to Monitoring Instance: $MONITORING_INSTANCE_ID"
            MONITORING_CMD_ID=$(aws ssm send-command \
              --instance-ids "$MONITORING_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy Monitoring Stack ${{ github.sha }}" \
              --parameters "{\"commands\":[
                \"if [ ! -d /home/ec2-user/app/.git ]; then git clone https://github.com/shravaneeghatol/ecom-saga-project.git /home/ec2-user/app; fi\",
                \"cd /home/ec2-user/app\",
                \"git fetch origin && git checkout $TARGET_BRANCH && git pull origin $TARGET_BRANCH\",
                \"chmod +x scripts/*.sh\",
                \"./scripts/configure-monitoring-ips.sh monitoring\",
                \"docker compose -f docker-compose.monitoring.yml up -d --force-recreate\",
                \"echo Waiting for monitoring services to boot...\",
                \"for p in 3000 9090 3100; do\",
                \"  echo Checking monitoring port \$p;\",
                \"  for i in {1..12}; do\",
                \"    curl -sf http://localhost:\$p/ && break || echo Waiting...;\",
                \"    sleep 5;\",
                \"  done;\",
                \"done\"
              ]}" \
              --query "Command.CommandId" --output text)
            echo "Monitoring stack command ID: $MONITORING_CMD_ID"
          fi
