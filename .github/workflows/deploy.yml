name: Deploy to EC2

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main, feature-swagger]
    types: [completed]
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy App Stack to Instance #1
        run: |
          # ── Resolve both Instance IDs and IPs in runner (single AWS call each) ──
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ecom-saga-app" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text 2>/dev/null || echo "")

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "❌ No running EC2 instance found with tag Name=ecom-saga-app"
            echo "Run: cd Infrastructure && terraform apply -auto-approve"
            exit 1
          fi

          # Resolve monitoring IP here (runner has IAM access) so EC2 never needs to call AWS
          MONITORING_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ecom-saga-monitoring" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text 2>/dev/null || echo "")
          echo "Deploying App Stack to instance: $INSTANCE_ID (Monitoring IP: $MONITORING_IP)"

          # ── Wait for SSM agent ────────────────────────────────────────────────
          for i in $(seq 1 12); do
            PING=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "Offline")
            [ "$PING" == "Online" ] && echo "SSM agent Online!" && break
            echo "SSM agent status: $PING. Waiting 3s... ($i/12)"
            sleep 3
          done

          # ── Determine target branch ───────────────────────────────────────────
          TARGET_BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [ -z "$TARGET_BRANCH" ] || [ "$TARGET_BRANCH" == "" ]; then
            TARGET_BRANCH="feature-swagger"
          fi
          echo "Target branch: $TARGET_BRANCH"

          # ── Send deployment command to Instance #1 ────────────────────────────
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy App ${{ github.sha }}" \
            --parameters "{\"commands\":[
              \"set -e\",
              \"if [ ! -d /home/ec2-user/app/.git ]; then git clone https://github.com/shravaneeghatol/ecom-saga-project.git /home/ec2-user/app; fi\",
              \"cd /home/ec2-user/app\",
              \"git fetch origin && git checkout ${TARGET_BRANCH} && git pull origin ${TARGET_BRANCH}\",
              \"if [ ! -f .env ]; then cp .env.example .env; fi\",
              \"if [ -n '${MONITORING_IP}' ] && [ '${MONITORING_IP}' != 'None' ]; then sed -i '/^LOKI_URL=/d' .env && echo LOKI_URL=http://${MONITORING_IP}:3100/loki/api/v1/push >> .env; fi\",
              \"docker compose -f docker-compose.yml -f Infrastructure/docker-compose.prod.yml up -d --force-recreate\",
              \"for i in {1..20}; do if curl -sf http://localhost:8081/actuator/health && curl -sf http://localhost:8082/actuator/health && curl -sf http://localhost:8083/actuator/health && curl -sf http://localhost:8084/actuator/health; then echo All services healthy!; exit 0; fi; sleep 3; done\",
              \"echo App Stack deployment complete\"
            ]}" \
            --query "Command.CommandId" --output text)

          echo "Waiting for App Stack deployment to complete..."
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            if [ "$STATUS" == "Success" ]; then
              echo "✅ App Stack deployed!"
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              echo "❌ Deployment failed: $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
              exit 1
            fi
            sleep 3
          done


      - name: Deploy Monitoring Stack to Instance #2
        run: |
          # ── Resolve Instance #2 by Name tag ──────────────────────────────────
          MONITORING_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ecom-saga-monitoring" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text 2>/dev/null || echo "")

          if [ -z "$MONITORING_INSTANCE_ID" ] || [ "$MONITORING_INSTANCE_ID" == "None" ]; then
            echo "⚠️  No monitoring instance found, skipping monitoring stack deployment."
            exit 0
          fi
          echo "Deploying Monitoring Stack to instance: $MONITORING_INSTANCE_ID"

          # ── Wait for SSM agent ────────────────────────────────────────────────
          for i in $(seq 1 12); do
            PING=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$MONITORING_INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "Offline")
            [ "$PING" == "Online" ] && echo "Monitoring SSM agent Online!" && break
            echo "Monitoring SSM status: $PING. Waiting 3s... ($i/12)"
            sleep 3
          done

          # ── Determine target branch ───────────────────────────────────────────
          TARGET_BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [ -z "$TARGET_BRANCH" ] || [ "$TARGET_BRANCH" == "" ]; then
            TARGET_BRANCH="feature-swagger"
          fi
          echo "Target branch: $TARGET_BRANCH"

          # Resolve app IP in runner (has IAM access) - no AWS calls needed on EC2
          APP_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ecom-saga-app" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text 2>/dev/null || echo "")
          echo "App Instance IP: $APP_IP"

          # ── Send deployment command to Instance #2 ────────────────────────────
          MONITORING_CMD_ID=$(aws ssm send-command \
            --instance-ids "$MONITORING_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Monitoring ${{ github.sha }}" \
            --parameters "{\"commands\":[
              \"set -e\",
              \"if [ ! -d /home/ec2-user/app/.git ]; then git clone https://github.com/shravaneeghatol/ecom-saga-project.git /home/ec2-user/app; fi\",
              \"cd /home/ec2-user/app\",
              \"git fetch origin && git checkout ${TARGET_BRANCH} && git pull origin ${TARGET_BRANCH}\",
              \"git checkout -- config/prometheus.yml\",
              \"sed -i 's|order-service:8081|${APP_IP}:8081|g; s|inventory-service:8082|${APP_IP}:8082|g; s|payment-service:8083|${APP_IP}:8083|g; s|notification-service:8084|${APP_IP}:8084|g; s|node-exporter:9100|${APP_IP}:9100|g; s|cadvisor:8080|${APP_IP}:8080|g' config/prometheus.yml\",
              \"docker compose -f docker-compose.monitoring.yml up -d --force-recreate\",
              \"echo Monitoring Stack deployment complete\"
            ]}" \
            --query "Command.CommandId" --output text)

          echo "Waiting for Monitoring Stack deployment to complete..."
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$MONITORING_CMD_ID" \
              --instance-id "$MONITORING_INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            if [ "$STATUS" == "Success" ]; then
              echo "✅ Monitoring Stack deployed!"
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              echo "❌ Monitoring deployment failed: $STATUS"
              aws ssm get-command-invocation --command-id "$MONITORING_CMD_ID" --instance-id "$MONITORING_INSTANCE_ID"
              exit 1
            fi
            sleep 3
          done
